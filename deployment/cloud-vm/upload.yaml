- name: Prepare OMB plans with drivers and workloads
  hosts: worker:monitoring
  gather_facts: false
  vars:
    clean_plans: false
    svc_name: ""
    # Set to an aiven-terraform environment to read the Kafka service details from its
    # outputs instead of the avn CLI. svc_name is then set to this name, so each
    # environment gets its own driver files in /etc/benchmark/drivers.
    aiven_tf_env: ""
    aiven_tf_dir: "{{ playbook_dir }}/../aiven-terraform"
  tasks:
    - file: path=/etc/benchmark state=absent
      when: clean_plans

    - file: path=/etc/benchmark/drivers state=directory
    - file: path=/etc/benchmark/workloads state=directory

    # --- Driver preparation (only when svc_name or aiven_tf_env is provided) ---

    - name: Read Kafka service details from aiven-terraform outputs
      command: "terraform -chdir={{ aiven_tf_dir }} output -raw {{ item }}"
      environment:
        TF_WORKSPACE: "{{ aiven_tf_env }}"
      loop:
        - kafka_service_uri
        - kafka_ca_cert
        - kafka_access_cert
        - kafka_access_key
      register: tf_outputs
      changed_when: false
      no_log: true
      delegate_to: localhost
      run_once: true
      become: false
      when: aiven_tf_env | length > 0

    - name: Set driver prefix and URI from aiven-terraform outputs
      set_fact:
        svc_name: "{{ aiven_tf_env }}"
        kafka_service_uri: "{{ tf_outputs.results[0].stdout }}"
      run_once: true
      when: aiven_tf_env | length > 0

    - name: Write Kafka credentials from aiven-terraform outputs
      copy:
        content: "{{ item.content | trim }}\n"
        dest: "{{ playbook_dir }}/{{ item.file }}"
        mode: "0600"
      loop:
        - { file: ca.pem, content: "{{ tf_outputs.results[1].stdout }}" }
        - { file: service.cert, content: "{{ tf_outputs.results[2].stdout }}" }
        - { file: service.key, content: "{{ tf_outputs.results[3].stdout }}" }
      loop_control:
        label: "{{ item.file }}"
      no_log: true
      delegate_to: localhost
      run_once: true
      become: false
      when: aiven_tf_env | length > 0

    - name: Gather Kafka service URI
      shell: "avn service get {{ svc_name }} --json | jq -r .service_uri"
      delegate_to: localhost
      run_once: true
      become: false
      register: get_service_uri_result
      when: svc_name | length > 0 and aiven_tf_env | length == 0

    - name: Set kafka service URI fact
      set_fact:
        kafka_service_uri: "{{ get_service_uri_result.stdout }}"
      run_once: true
      when: svc_name | length > 0 and aiven_tf_env | length == 0

    - name: Display the kafka service URI
      debug:
        var: kafka_service_uri
      run_once: true
      when: svc_name | length > 0

    - name: Get credentials
      shell: "avn service user-creds-download {{ svc_name }} --username avnadmin"
      delegate_to: localhost
      run_once: true
      become: false
      when: svc_name | length > 0 and aiven_tf_env | length == 0

    - name: Prepare driver bundle locally
      block:
        - name: Create local temp dir for driver bundle
          tempfile:
            state: directory
            prefix: omb-drivers-
          register: driver_bundle_dir
          delegate_to: localhost
          run_once: true
          become: false

        - name: Copy CA to bundle
          copy:
            src: ca.pem
            dest: "{{ driver_bundle_dir.path }}/{{ svc_name }}-ca.pem"
          delegate_to: localhost
          run_once: true
          become: false

        - name: Join service certificate and key into the keystore bundle
          copy:
            content: "{{ lookup('file', 'service.cert') }}\n{{ lookup('file', 'service.key') }}\n"
            dest: "{{ driver_bundle_dir.path }}/{{ svc_name }}-service.pem"
            mode: "0600"
          no_log: true
          delegate_to: localhost
          run_once: true
          become: false

        - name: Find driver templates
          find:
            paths: ./drivers
            patterns: "*.yaml"
          delegate_to: localhost
          run_once: true
          become: false
          register: driver_templates

        - name: Render driver templates to bundle
          template:
            src: "{{ item.path }}"
            dest: "{{ driver_bundle_dir.path }}/{{ svc_name }}-{{ item.path | basename }}"
          loop: "{{ driver_templates.files }}"
          loop_control:
            label: "{{ item.path | basename }}"
          delegate_to: localhost
          run_once: true
          become: false

        - name: Create driver tarball
          community.general.archive:
            path: "{{ driver_bundle_dir.path }}/"
            dest: "{{ driver_bundle_dir.path }}.tar.gz"
            format: gz
            mode: "0600"
          delegate_to: localhost
          run_once: true
          become: false

        - name: Upload driver tarball
          copy:
            src: "{{ driver_bundle_dir.path }}.tar.gz"
            dest: /tmp/omb-drivers.tar.gz
            mode: "0600"

        - name: Extract driver tarball
          unarchive:
            src: /tmp/omb-drivers.tar.gz
            dest: /etc/benchmark/drivers/
            remote_src: yes

      always:
        - name: Clean up remote tarball
          file:
            path: /tmp/omb-drivers.tar.gz
            state: absent

        - name: Clean up local temp dir and tarball
          file:
            path: "{{ item }}"
            state: absent
          loop:
            - "{{ driver_bundle_dir.path }}"
            - "{{ driver_bundle_dir.path }}.tar.gz"
          delegate_to: localhost
          run_once: true
          become: false
          when: driver_bundle_dir is defined and driver_bundle_dir.path is defined
      when: svc_name | length > 0

    # --- Workloads (always uploaded) ---

    - name: Upload Workloads
      ansible.posix.synchronize:
        src: ./workloads/
        dest: /etc/benchmark/workloads/
        delete: yes
