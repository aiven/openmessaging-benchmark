groups:
  - name: ena_network_limits
    interval: 30s
    rules:
      # Bandwidth exceeded ratios
      - record: node:ena_bw_in_exceeded_ratio
        expr: |
          rate(node_ethtool_bw_in_allowance_exceeded[5m])
          / (rate(node_network_receive_packets_total[5m]) + 1)

      - record: node:ena_bw_out_exceeded_ratio
        expr: |
          rate(node_ethtool_bw_out_allowance_exceeded[5m])
          / (rate(node_network_transmit_packets_total[5m]) + 1)

      # PPS exceeded ratio
      - record: node:ena_pps_exceeded_ratio
        expr: |
          rate(node_ethtool_pps_allowance_exceeded[5m])
          / (
            rate(node_network_receive_packets_total[5m])
            + rate(node_network_transmit_packets_total[5m])
            + 1
          )

      # Conntrack exceeded ratio (relative to observed packets)
      - record: node:ena_conntrack_exceeded_ratio
        expr: |
          rate(node_ethtool_conntrack_allowance_exceeded[5m])
          / (
            rate(node_network_receive_packets_total[5m])
            + rate(node_network_transmit_packets_total[5m])
            + 1
          )

      # Link local exceeded ratio
      - record: node:ena_linklocal_exceeded_ratio
        expr: |
          rate(node_ethtool_linklocal_allowance_exceeded[5m])
          / (
            rate(node_network_receive_packets_total[5m])
            + rate(node_network_transmit_packets_total[5m])
            + 1
          )
