name: Deployment checks

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        directory:
          - deployment/aiven-terraform
          - deployment/cloud-vm/terraform/aws

    steps:
      - uses: actions/checkout@v4
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false

      - name: Check the format
        run: terraform fmt -check -diff -recursive ${{ matrix.directory }}

      - name: Initialize without a backend
        working-directory: ${{ matrix.directory }}
        run: terraform init -backend=false -input=false

      - name: Validate
        working-directory: ${{ matrix.directory }}
        run: terraform validate

  ansible:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ansible and its collections
        run: |
          pip install 'ansible-core>=2.18,<2.19'
          ansible-galaxy collection install -r deployment/cloud-vm/ansible-galaxy.yaml

      - name: Check the syntax of the playbooks
        working-directory: deployment/cloud-vm
        run: |
          for playbook in deploy.yaml upload.yaml delete_topics.yaml; do
            ansible-playbook -i localhost, --syntax-check "$playbook"
          done
